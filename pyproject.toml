[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "active-pauses"
version = "0.1.0"
description = "A production-grade Linux health companion daemon for desk workers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "dasbus>=1.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.4",
    "sqlalchemy[mypy]>=2.0",
    "httpx>=0.27",
]

[project.scripts]
active-pauses = "active_pauses.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/active_pauses"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
